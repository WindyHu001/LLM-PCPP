# Paper Experiment 1: complex outdoor construction site (drone footage).
#
# Coordinates: one grid cell per image pixel, origin at the bottom-left corner,
# x to the right, y up. A region [[x_min, x_max], [y_min, y_max]] blocks the
# cells x_min <= x < x_max, y_min <= y < y_max.

name: exp1_complex_outdoor
description: Complex outdoor construction site from drone footage, high obstacle density (50%).

grid:
  width: 3840
  height: 2160

start: [1920, 0]

task_guidance: Avoid the obstacles, ensure coverage of most areas.

# Obstacle classes are listed in the order in which they are written into the
# LLM-A* prompt. `label` is the value used on the grid (and selects the hatch
# pattern in plots).
obstacle_classes:
  - name: Green Fields
    label: 4
    regions:
      - [[0, 450], [650, 2160]]
      - [[3000, 3840], [0, 1400]]
  - name: Construction Sites
    label: 1
    regions:
      - [[1700, 2100], [400, 1100]]
      - [[400, 1100], [0, 700]]
      - [[2300, 3840], [1550, 2160]]
  - name: Engineering Vehicles
    label: 2
    regions:
      - [[1900, 2100], [1300, 1600]]
      - [[2100, 2300], [1200, 1500]]
      - [[2400, 2800], [700, 1500]]
  - name: Building Materials
    label: 3
    regions:
      - [[0, 400], [0, 650]]
      - [[450, 1000], [800, 1900]]

# POIs identified with ChatGPT-4o for this map ("Additional point for
# monitoring in adjacent area").
pois:
  - {name: POI_0, x: 1493, y: 1715}
  - {name: POI_1, x: 1474, y: 746}
  - {name: POI_2, x: 2660, y: 690}
  - {name: POI_3, x: 1805, y: 1537}
  - {name: POI_4, x: 3143, y: 1529}
  - {name: POI_5, x: 1041, y: 1721}
  - {name: POI_6, x: 2650, y: 643}
  - {name: POI_7, x: 2802, y: 551}
  - {name: POI_8, x: 2391, y: 148}
  - {name: POI_9, x: 1005, y: 2039}
  - {name: POI_10, x: 2907, y: 348}
  - {name: POI_11, x: 1217, y: 397}
  - {name: POI_12, x: 2891, y: 1517}
  - {name: POI_13, x: 3541, y: 1534}
  - {name: POI_14, x: 709, y: 1935}

# A* settings used for the published numbers.
planners:
  astar:
    neighbor_order: diagonal_first
    diagonal_cost: exact
  llm-astar:
    neighbor_order: axis_first
    diagonal_cost: 1.414
    model: gpt-4o

# Numbers reported in the paper (Table 2) and the TSP tours from the run logs.
paper_results:
  astar:
    path_length: 9270.45
    operations: 72343616
    storage: 44987486
    route: [0, 9, 11, 8, 7, 3, 14, 5, 13, 4, 1, 10, 15, 6, 2, 12, 0]
  llm-astar:
    path_length: 10530.60
    operations: 42636892
    storage: 28383237
    route: [0, 9, 8, 7, 3, 11, 5, 14, 13, 4, 1, 15, 10, 6, 2, 12, 0]
